name: release

on:
  push:
    tags: ["v*"]
  # lets you publish from a branch without tagging, for a trial run
  workflow_dispatch:

jobs:
  # Never publish an image whose tests do not pass.
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: write        # required to create the GitHub Release
      packages: write        # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # provided automatically; no secret to configure
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> :1.2.3, :1.2, :latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # metadata-action fills org.opencontainers.image.description from the
          # repository description, which is empty — leaving the package page
          # blank. Set it here so it does not depend on a GitHub setting.
          labels: |
            org.opencontainers.image.description=RAG chatbot over your documents and Confluence, with cited answers

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub's store: the slow layers are the dependency
          # install and the 240 MB model download, and neither changes often.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only. arm64 would need QEMU, and the build runs ONNX inference
          # (the baked index) — emulated, that turns minutes into a lot of
          # minutes. Add linux/arm64 here if Apple Silicon users need a native
          # image and you can spend the build time.
          platforms: linux/amd64

      # The container image is what actually ships; this is the human-facing
      # entry on the repository's Releases page, which stays empty otherwise.
      # `--generate-notes` appends the commit log since the previous tag to the
      # body below.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "## Run it

          \`\`\`bash
          docker run --rm $IMAGE:${TAG#v} env-template > .env   # then fill it in
          docker run --rm $IMAGE:${TAG#v} secret                # paste into .env
          docker run --env-file .env -p 8000:8000 -v ragbot-data:/app/data $IMAGE:${TAG#v}
          \`\`\`

          Then open <http://localhost:8000> and sign in with the credentials from your \`.env\`.
          See the [README](https://github.com/${{ github.repository }}#readme) for details."
